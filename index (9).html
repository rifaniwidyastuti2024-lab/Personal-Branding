<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandUp — AI untuk Personal Branding</title>
<style>
:root{--ink:#3a0d2c;--mut:#7d5a70;--bg:#fff4f9;--card:#fff;--pink:#d6246e;--pink2:#ff6fae;--soft:#ffdcec;--deep:#6d1048;--ok:#1e9e6a;--warn:#e08a00;--bad:#d3342f;--line:#f5cfe1}
*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 95% -5%,#ffc4de 0,transparent 38%),radial-gradient(circle at 0 100%,#ffd9ea 0,transparent 36%),var(--bg);background-attachment:fixed;color:var(--ink);line-height:1.55}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;line-height:1.2}h1{font-size:1.9rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
.app{display:flex;min-height:100vh}
aside{width:270px;background:linear-gradient(175deg,#5a0b3d,#b0155d 55%,#ff5fa2);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto;border-radius:0 28px 28px 0;box-shadow:6px 0 30px rgba(214,36,110,.25);z-index:60;display:flex;flex-direction:column}
aside::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;right:-80px;pointer-events:none}
.logo{font-family:Georgia,serif;font-size:1.65rem;padding:0 10px 20px;display:flex;align-items:center;gap:10px;position:relative}.logo i{font-style:normal;background:#fff;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;box-shadow:0 4px 14px rgba(0,0,0,.2)}.logo small{display:block;font:.72rem system-ui;opacity:.85}
aside button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#ffe6f1;padding:10px 12px;border-radius:16px;font:inherit;cursor:pointer;margin-bottom:5px;position:relative;transition:.15s}
aside button span{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex-shrink:0}
aside button:hover{background:rgba(255,255,255,.16);transform:translateX(3px)}aside button.on{background:#fff;color:var(--deep);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}aside button.on span{background:var(--soft)}
.sfoot{margin-top:auto;background:rgba(255,255,255,.15);border-radius:18px;padding:14px;font-size:.82rem;position:relative}.sfoot .bar{background:rgba(255,255,255,.25)}.sfoot .bar i{background:#fff}
.menu{display:none;position:fixed;top:12px;left:12px;z-index:45;width:46px;height:46px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-size:1.4rem;box-shadow:0 6px 18px rgba(214,36,110,.4);cursor:pointer}
#ov{display:none;position:fixed;inset:0;background:rgba(58,13,44,.5);z-index:55;backdrop-filter:blur(2px)}
main{flex:1;padding:26px;max-width:1000px;margin:0 auto;width:100%;min-width:0}
.demo{background:#fff;border:1px dashed var(--pink2);color:var(--deep);padding:9px 14px;border-radius:12px;font-size:.84rem;margin-bottom:18px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 4px 18px rgba(214,36,110,.10);margin-bottom:16px;border:1px solid var(--line);border-top:3px solid var(--pink2);transition:.2s}.card:hover{box-shadow:0 10px 28px rgba(214,36,110,.18)}
.hero{background:linear-gradient(120deg,#c2185b,var(--pink2) 80%,#ffa6cd);color:#fff;border:0;position:relative;overflow:hidden;padding:30px}.hero::after{content:"♥";position:absolute;right:22px;top:-10px;font-size:9rem;opacity:.16}.hero h1{font-size:2.2rem}.hero p{margin:.2em 0;opacity:.95}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}.hint{font-weight:400;color:var(--mut);font-size:.78rem}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--soft);border-color:var(--pink)}
input:disabled,select:disabled,textarea:disabled{background:#fbeef4;color:#5b3a4e}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500;background:var(--bg);padding:7px 12px;border-radius:99px;border:1px solid var(--line)}.chk input{width:auto}
.btn{background:var(--pink);color:#fff;border:0;padding:10px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;margin:12px 8px 0 0;transition:.15s}
.btn:hover{background:var(--deep);transform:translateY(-1px)}.btn:active{transform:none}.btn.alt{background:var(--soft);color:var(--deep)}.btn.alt:hover{background:#ffc4de}.btn.danger{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.big{font-family:Georgia,serif;font-size:2.3rem;color:var(--pink);line-height:1}.mut{color:var(--mut);font-size:.88rem}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:9px}
.empty{text-align:center;padding:26px;color:var(--mut);border:2px dashed var(--line);border-radius:16px;background:#fff}
.tag{display:inline-block;background:var(--soft);color:var(--deep);padding:3px 11px;border-radius:99px;font-size:.78rem;margin:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item{padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fffafd}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.err{color:var(--bad);font-size:.8rem;margin-top:3px}
#toast{position:fixed;right:16px;bottom:78px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:var(--deep);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:320px;font-size:.9rem}#toast .err2{background:var(--bad)}
#bnav{display:none}
#top{display:none}
@media(max-width:820px){aside{display:none}main{padding:0 14px 110px}h1{font-size:1.5rem}.hero h1{font-size:1.7rem}.hero{padding:24px}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 16px;padding:14px 18px;background:linear-gradient(120deg,#8e0f55,var(--pink) 60%,var(--pink2));color:#fff;border-radius:0 0 26px 26px;box-shadow:0 8px 22px rgba(214,36,110,.3);position:sticky;top:0;z-index:30}
#top b{font-family:Georgia,serif;font-size:1.3rem;display:flex;align-items:center;gap:8px}#top small{display:block;font:.68rem system-ui;opacity:.85}
#top em{font-style:normal;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;font-size:.78rem;white-space:nowrap}
#bnav{display:flex;gap:4px;position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:28px;padding:7px;box-shadow:0 10px 32px rgba(214,36,110,.35);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:40;scroll-behavior:smooth}#bnav::-webkit-scrollbar{display:none}
#bnav button{flex:0 0 auto;min-width:66px;background:none;border:0;font:600 .66rem system-ui;color:var(--mut);padding:7px 6px;border-radius:20px;cursor:pointer;transition:.2s}
#bnav button span{display:block;font-size:1.3rem;transition:.2s}
#bnav button.on{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 5px 14px rgba(214,36,110,.45);min-width:86px}#bnav button.on span{transform:translateY(-2px) scale(1.15)}
#toast{bottom:96px;left:14px;right:14px;align-items:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app"><aside id="side"></aside>
<main><div id="top"></div><div id="view"></div></main></div>
<nav id="bnav"></nav><div id="toast"></div>
<script>
/* ===== Data & utilitas ===== */
const KEY='brandup.v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=s=>String(s||'').split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);
const lc=s=>String(s||'').toLowerCase();
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const blank=()=>({profile:null,identity:null,drafts:[],sessions:[],evaluation:null,seed:0});
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&typeof d==='object'?Object.assign(blank(),d):blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Gagal menyimpan: penyimpanan browser penuh atau dinonaktifkan.',1);return false}}
function toast(m,bad){const t=document.createElement('div');if(bad)t.className='err2';t.textContent=m;document.getElementById('toast').appendChild(t);setTimeout(()=>t.remove(),3200)}
const fn=()=>S.profile.nama.trim().split(/\s+/)[0];
const pick=(a,k=0)=>a[(S.seed+k)%a.length];
const sig=p=>JSON.stringify(p);
const $=id=>document.getElementById(id);
const val=id=>($(id)?$(id).value.trim():'');
function copyText(t){if(!t)return toast('Tidak ada teks untuk disalin.',1);
 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();toast(ok?'Teks berhasil disalin.':'Gagal menyalin. Blok teks lalu salin manual.',!ok)};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Teks berhasil disalin.'),fb);else fb()}
const needProfile=()=>`<div class="empty"><h3>Profil belum lengkap</h3><p>Isi dan simpan <b>Profil Saya</b> terlebih dahulu agar fitur ini dapat membuat hasil yang sesuai denganmu.</p><button class="btn" onclick="go('profil')">Isi Profil Saya</button></div>`;
const completeness=()=>{const p=S.profile;if(!p)return 0;const k=['nama','status','bidang','pendidikan','pengalaman','skill','minat','unik','audiens','tujuan','gaya'];let n=k.filter(x=>p[x]&&String(p[x]).trim()).length+(p.platform&&p.platform.length?1:0);return Math.round(n/12*100)};

/* ===== Navigasi ===== */
const PAGES=[['dashboard','🏠','Dashboard'],['profil','👤','Profil Saya'],['identitas','✨','Identitas Profesional'],['studio','📝','Studio Konten'],['wawancara','🎤','Simulasi Wawancara'],['evaluasi','📊','Evaluasi Personal Branding'],['pengaturan','⚙️','Pengaturan']];
const SHORT={dashboard:'Beranda',pengaturan:'Atur',identitas:'Identitas',studio:'Konten',wawancara:'Wawancara',evaluasi:'Evaluasi',profil:'Profil'};
let cur='dashboard';
function toggleMenu(f){document.body.classList.toggle('open',f)}
function go(id){toggleMenu(false);cur=id;history.replaceState(null,'','#'+id);render();window.scrollTo(0,0)}
function nav(){const c=completeness();$('bnav').innerHTML=PAGES.map(p=>`<button class="${p[0]===cur?'on':''}" onclick="go('${p[0]}')"><span>${p[1]}</span>${SHORT[p[0]]||p[2]}</button>`).join('');$('top').innerHTML=`<b><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="8" r="4" fill="#fff"/><path d="M3 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#fff"/><path d="M19 2l.9 2.1L22 5l-2.1.9L19 8l-.9-2.1L16 5l2.1-.9z" fill="#ffd0e6"/></svg> BrandUp</b><em>Profil ${c}%</em>`;const ac=document.querySelector('#bnav .on');if(ac)$('bnav').scrollLeft=ac.offsetLeft-90;$('side').innerHTML='<div class="logo"><i><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="8" r="4" fill="#d6246e"/><path d="M3 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#d6246e"/><path d="M19 2l.9 2.1L22 5l-2.1.9L19 8l-.9-2.1L16 5l2.1-.9z" fill="#ff6fae"/></svg></i><div>BrandUp</div></div>'+PAGES.map(p=>`<button class="${p[0]===cur?'on':''}" onclick="go('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join('')+`<div class="sfoot">Kelengkapan profil <b>${c}%</b><div class="bar"><i style="width:${c}%"></i></div>${S.profile?'Halo, '+esc(fn())+'!':'Mulai dari Profil Saya'}</div>`}
function render(){nav();$('view').innerHTML=({dashboard:vDash,profil:vProfil,identitas:vId,studio:vStudio,wawancara:vIv,evaluasi:vEval,pengaturan:vSet})[cur]()}

/* ===== Dashboard ===== */
function vDash(){const p=S.profile,c=completeness(),ev=S.evaluation,ss=S.sessions;
 const nxt=[];if(!p)nxt.push(['Lengkapi dan simpan Profil Saya','profil']);else{if(c<100)nxt.push(['Lengkapi profil yang masih kosong ('+c+'%)','profil'])}
 if(p&&!S.identity)nxt.push(['Buat dan simpan Identitas Profesional','identitas']);
 if(S.identity&&S.drafts.length<3)nxt.push(['Simpan minimal 3 draf konten di Studio Konten','studio']);
 if(p&&!ss.length)nxt.push(['Latihan wawancara pertamamu','wawancara']);
 if(p&&!ev)nxt.push(['Jalankan Evaluasi Personal Branding','evaluasi']);
 if(ev&&ev.items){ev.items.filter(i=>i.score===null).forEach(i=>nxt.push(['Data untuk "'+i.label+'" belum cukup: '+i.why,'evaluasi']));const w=ev.items.filter(i=>i.score!==null).sort((a,b)=>a.score-b.score)[0];if(w&&w.score<75)nxt.push(['Perbaiki "'+w.label+'": '+w.tip,'evaluasi'])}
 if(p&&S.identity&&S.identity.sig!==sig(p))nxt.push(['Profil berubah sejak identitas dibuat — perbarui hasil jika perlu','identitas']);
 const avg=ss.length?Math.round(ss.reduce((a,s)=>a+s.avg,0)/ss.length):null;
 return `<div class="card hero"><h1>${p?'Halo, '+esc(fn())+'!':'Selamat datang di BrandUp'}</h1><p>${p?esc(p.status)+' · '+esc(p.bidang):'Bangun identitas dan citra profesionalmu langkah demi langkah.'}</p><p>${p?'Tujuan: '+esc(p.tujuan):'Mulailah dari mengisi Profil Saya.'}</p></div>
 <div class="grid"><div class="card"><h3>Kelengkapan profil</h3><div class="big">${c}%</div><div class="bar"><i style="width:${c}%"></i></div><span class="mut">${p?'Profil tersimpan':'Belum ada profil tersimpan'}</span></div>
 <div class="card"><h3>Identitas profesional</h3>${S.identity?`<p class="mut">“${esc(S.identity.tagline)}”</p><p>${esc(S.identity.bioPendek)}</p>`:'<p class="mut">Belum dibuat.</p>'}</div>
 <div class="card"><h3>Draf konten</h3><div class="big">${S.drafts.length}</div><span class="mut">${S.drafts.length?'Terakhir: '+esc(S.drafts[0].judul):'Belum ada draf tersimpan'}</span></div>
 <div class="card"><h3>Latihan wawancara</h3><div class="big">${ss.length}</div><span class="mut">${ss.length?'Skor rata-rata '+avg+'/100':'Belum ada latihan tersimpan'}</span></div>
 <div class="card"><h3>Evaluasi branding</h3>${ev&&ev.overall!=null?`<div class="big">${ev.overall}</div><span class="mut">dari 100 · ${esc(ev.date)}</span>`:`<span class="mut">${ev?'Data belum cukup untuk skor keseluruhan.':'Belum dievaluasi.'}</span>`}</div></div>
 <div class="card"><h2>Langkah berikutnya</h2>${nxt.length?nxt.map(n=>`<div class="item row"><span>${esc(n[0])}</span><button class="btn alt" style="margin:0" onclick="go('${n[1]}')">Buka</button></div>`).join(''):'<p class="ok">Semua langkah utama sudah terpenuhi. Pertahankan konsistensi konten!</p>'}</div>`}

/* ===== Profil ===== */
const FIELDS=[['nama','Nama lengkap','text',1,'Contoh: Anisa Putri Rahma'],['status','Status / profesi','sel',1,['Mahasiswa','Pencari kerja','Kreator konten','Pelaku usaha','Profesional']],['bidang','Bidang keahlian / minat','text',1,'Contoh: Pemasaran digital'],['pendidikan','Pendidikan / latar belakang','text',0,'Contoh: S1 Manajemen, Universitas ...'],['pengalaman','Pengalaman dan pencapaian','area',0,'Contoh: Ketua divisi humas, menaikkan pengikut organisasi 40% dalam 3 bulan'],['skill','Keterampilan utama','text',1,'Pisahkan dengan koma. Contoh: copywriting, analisis data, desain Canva'],['minat','Minat dan nilai pribadi','text',0,'Contoh: kolaborasi, belajar berkelanjutan'],['unik','Kelebihan / keunikan diri','area',0,'Apa yang membuatmu berbeda dari yang lain?'],['audiens','Target audiens','text',1,'Contoh: rekruter, pemilik UMKM, sesama mahasiswa'],['tujuan','Tujuan personal branding','text',1,'Contoh: mendapatkan magang di bidang pemasaran'],['gaya','Gaya komunikasi','sel',1,['Profesional','Ramah','Kreatif','Formal']]];
const PLAT=['LinkedIn','Instagram','TikTok','YouTube','X/Twitter','Lainnya'];
function vProfil(){const p=S.profile||{},lock=!!S.profile;
 const f=FIELDS.map(([k,l,t,r,h])=>{const v=esc(p[k]||'');let i;
  if(t==='sel')i=`<select id="f_${k}"><option value="">Pilih...</option>${h.map(o=>`<option ${p[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(t==='area')i=`<textarea id="f_${k}" placeholder="${esc(h)}">${v}</textarea>`;else i=`<input id="f_${k}" value="${v}" placeholder="${esc(h)}">`;
  return `<div><label>${l}${r?' *':' <span class="hint">(opsional)</span>'}</label>${i}<div class="err" id="e_${k}"></div></div>`}).join('');
 return `<h1>Profil Saya</h1><p class="mut">Data ini menjadi dasar semua fitur lain. Tanda * wajib diisi.</p><div class="card"><div class="g2">${f}</div>
 <label>Platform yang ingin digunakan <span class="hint">(opsional)</span></label><div class="chk">${PLAT.map(x=>`<label><input type="checkbox" class="pl" value="${x}" ${(p.platform||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div>
 <button class="btn" onclick="saveProfile()">Simpan Profil</button><button class="btn alt" onclick="editProfile()">Edit Profil</button><button class="btn alt" onclick="resetForm()">Reset Formulir</button></div>`+(lock?'<script>0<\/script>':'')}
function setLock(l){document.querySelectorAll('[id^=f_],.pl').forEach(e=>e.disabled=l)}
function afterProfil(){setLock(!!S.profile)}
function saveProfile(){const p={};let bad=0;
 FIELDS.forEach(([k,l,t,r])=>{p[k]=val('f_'+k);const e=$('e_'+k);e.textContent='';if(r&&!p[k]){e.textContent=l+' wajib diisi.';bad++}});
 if(p.nama&&p.nama.length<2){$('e_nama').textContent='Nama terlalu pendek.';bad++}
 if(bad)return toast('Periksa kembali isian yang ditandai.',1);
 p.platform=[...document.querySelectorAll('.pl:checked')].map(x=>x.value);
 const old=S.profile;S.profile=p;if(!save()){S.profile=old;return}
 toast('Profil berhasil disimpan.');if(S.identity&&S.identity.sig!==sig(p))toast('Profil berubah. Buka Identitas Profesional untuk memperbarui hasil.');
 render();afterProfil()}
function editProfile(){if(!S.profile)return toast('Belum ada profil tersimpan. Isi formulir lalu simpan.',1);setLock(false);toast('Mode edit aktif. Klik Simpan Profil setelah selesai.')}
function resetForm(){document.querySelectorAll('[id^=f_]').forEach(e=>{e.value='';e.disabled=false});document.querySelectorAll('.pl').forEach(e=>{e.checked=false;e.disabled=false});toast('Formulir dikosongkan. Profil tersimpan tidak berubah sampai kamu menyimpan.')}

/* ===== Identitas ===== */
let tmpId=null;
const GAYA={Profesional:'Lugas, terstruktur, dan berbasis contoh nyata.',Ramah:'Hangat, mudah didekati, dan bersahabat.',Kreatif:'Segar, penuh cerita, dan berani bereksperimen.',Formal:'Sopan, tepat, dan terukur.'};
function genIdentity(){const p=S.profile,sk=L(p.skill),t=sk.slice(0,3).join(', ')||p.bidang,n=fn(),st=lc(p.status),pf=(p.platform||[]).join(', ')||'media digital';
 const U=p.unik?p.unik.split(/(?<=[.!?])\s/)[0].replace(/[.!?]*$/,'')+'.':'Selalu belajar dan berkembang bersama orang lain.';
 const m=L(p.minat).join(', ');
 const pe=p.pengalaman?p.pengalaman.replace(/\s*\n\s*/g,'; ').replace(/[.;]+$/,''):'';
 return {ringkasan:`${p.nama} adalah ${st} di bidang ${p.bidang} yang ${pick(['berfokus pada','sedang membangun reputasi untuk','bertekad untuk'])} ${lc(p.tujuan)}. Dengan keahlian di ${t}, ${n} ingin dikenal ${p.audiens?'oleh '+p.audiens:''} sebagai ${pick(['praktisi yang dapat diandalkan','pembelajar cepat yang konsisten memberi hasil','pemecah masalah yang komunikatif'],1)}.`,
 nilai:`${U}${m?' Nilai yang dipegang: '+m+'.':''}`,
 keahlian:sk.slice(0,5).map(x=>'• '+x).join('\n')||'• '+p.bidang,
 audiens:`${p.audiens}. Dijangkau melalui ${pf}.`,
 pesan:pick([`${n} membantu ${p.audiens} memahami dan memanfaatkan ${p.bidang} dengan cara yang praktis.`,`Di bidang ${p.bidang}, ${t} adalah cara ${n} memberi nilai nyata bagi ${p.audiens}.`,`${n} percaya ${p.bidang} paling berdampak jika dikerjakan dengan ${m||'konsisten'} dan dibagikan secara terbuka.`],2),
 gaya:`${p.gaya}: ${GAYA[p.gaya]||''}`,gayaKey:p.gaya,

 if(m.jel<60)notes.push(n<40?'Jawaban terlalu singkat. Targetkan sekitar 40–150 kata.':'Jawaban terlalu panjang. Ringkas ke poin terpenting.');
 if(m.str<60)notes.push('Susun dengan alur: situasi → tindakan → hasil, dan gunakan kata penghubung.');
 if(m.kon<60)notes.push('Tambahkan satu contoh nyata, angka, atau hasil terukur.');
 const pe=(p.pengalaman||'').split(/\n|;/)[0].trim().replace(/[.]+$/,''),sk=L(p.skill).slice(0,2).join(' dan ');
 const sample=`Saya ${p.nama}, ${lc(p.status)} di bidang ${p.bidang}. Keahlian utama saya adalah ${sk||p.bidang}. ${pe?'Misalnya, '+pe+'. ':'Misalnya, saya pernah menyelesaikan proyek yang melatih keahlian tersebut. '}Dari pengalaman itu, hasilnya terasa bagi ${p.audiens}. Karena itu, saya yakin dapat berkontribusi sebagai ${IV.cfg.pos} dan ingin ${lc(p.tujuan)}.`;
 const low=Object.entries(m).sort((x,y)=>x[1]-y[1])[0][0];const tip={rel:'tingkatkan relevansi',jel:'atur panjang jawaban',str:'perbaiki struktur',kon:'tambahkan contoh konkret'}[low];
 return {q,a,m,total,notes,sample,tip:'prioritas: '+tip,low}}
function sendAns(){if(IV.rec)IV.rec.stop();const a=val('v_ans');if(a.length<10)return toast('Tulis jawaban minimal beberapa kalimat sebelum mengirim.',1);IV.ans[IV.i]=evalAns(IV.qs[IV.i],a);IV.fb=false;render();toast('Jawaban dinilai. Klik Lihat Umpan Balik untuk detail.')}
function nextQ(){if(IV.i+1<IV.qs.length){IV.i++;IV.fb=false}else IV.phase='done';render();window.scrollTo(0,0)}
const ivAvg=()=>Math.round(IV.ans.reduce((s,a)=>s+a.total,0)/IV.ans.length);
function ivSummary(){const c={};IV.ans.forEach(a=>c[a.low]=(c[a.low]||0)+1);const k=Object.entries(c).sort((x,y)=>y[1]-x[1])[0][0];return {rel:'Eratkan jawaban dengan bidang dan keahlianmu.',jel:'Atur panjang jawaban agar ringkas namun lengkap.',str:'Biasakan alur situasi–tindakan–hasil.',kon:'Siapkan 3 cerita pengalaman konkret dengan angka.'}[k]}
function saveIv(){const s={jenis:IV.cfg.jenis,pos:IV.cfg.pos,lv:IV.cfg.lv,avg:ivAvg(),n:IV.ans.length,date:new Date().toLocaleDateString('id-ID')};S.sessions.unshift(s);if(save()){IV.saved=true;render();toast('Hasil latihan disimpan.')}else S.sessions.shift()}

/* ===== Evaluasi ===== */
function compute(){const p=S.profile,id=S.identity,d=S.drafts,I=[];
 const kw=[...L(p.skill),...L(p.bidang)].map(lc).filter(x=>x.length>2),aud=lc(p.audiens).split(/[^\p{L}]+/u).filter(x=>x.length>3);
 const add=(key,label,score,why,tip)=>I.push({key,label,score:score==null?null:Math.max(0,Math.min(100,Math.round(score))),why,tip});
 add('a','Kejelasan identitas profesional',id?(IDF.filter(([k])=>String(id[k]||'').length>(k==='tagline'?5:20)).length/IDF.length*60+completeness()*.4):null,'Identitas profesional belum disimpan.','Lengkapi profil dan semua kolom identitas, lalu simpan.');
 const dt=x=>lc(x.text);
 add('b','Konsistensi profil dan konten',d.length?40+60*d.filter(x=>kw.some(k=>dt(x).includes(k))).length/d.length:null,'Belum ada draf konten tersimpan.','Sebut keahlian utamamu dalam setiap konten.');
 const uw=lc(p.unik).split(/[^\p{L}]+/u).filter(x=>x.length>4),idt=id?lc(id.bioPendek+id.bioPanjang+id.nilai):'';
 add('c','Kejelasan keunggulan / nilai unik',Math.min(60,(p.unik||'').length/2)+(id&&uw.filter(w=>idt.includes(w)).length>=2?40:0),'','Tulis keunikanmu lebih spesifik di profil dan pastikan muncul di bio.');
 add('d','Kesesuaian konten dengan target audiens',d.length?30+35*d.filter(x=>aud.some(w=>dt(x).includes(w))).length/d.length+35*d.filter(x=>(p.platform||[]).includes(x.platform)).length/d.length:null,'Belum ada draf konten tersimpan.','Sapa target audiens dan gunakan platform pilihanmu di profil.');
 const bp=id?id.bioPanjang:'';add('e','Kualitas bio profesional',id?(bp.length>=300&&bp.length<=1200?40:Math.min(40,bp.length/300*40))+(lc(bp).includes(lc(p.nama.split(' ')[0]))?20:0)+(kw.some(k=>lc(bp).includes(k))?20:0)+(/hubungi|terhubung|kolaborasi|berdiskusi/.test(lc(bp))?20:0):null,'Bio profesional belum disimpan.','Bio idealnya 300–1200 karakter, memuat nama, keahlian, dan ajakan terhubung.');
 const gs=[...d.map(x=>x.gaya===p.gaya?1:0),...(id?[id.gayaKey===p.gaya?1:0]:[])];
 add('f','Konsistensi gaya komunikasi',gs.length?Math.max(20,gs.reduce((a,b)=>a+b,0)/gs.length*100):null,'Belum ada identitas atau draf konten.','Gunakan gaya yang sama di identitas dan konten, atau perbarui profil.');
 const r=I.filter(x=>x.score!==null);return {items:I,overall:r.length>=3?Math.round(r.reduce((a,b)=>a+b.score,0)/r.length):null,date:new Date().toLocaleString('id-ID')}}
function vEval(){if(!S.profile)return '<h1>Evaluasi Personal Branding</h1>'+needProfile();const e=S.evaluation;
 let h=`<h1>Evaluasi Personal Branding</h1><p class="mut">Dihitung dari profil, bio, dan draf yang tersimpan. <b>Hasil bersifat indikatif, bukan pengukuran profesional yang tervalidasi.</b></p><button class="btn" onclick="runEval()">Evaluasi Personal Branding</button>`;
 if(!e)return h+'<div class="empty" style="margin-top:14px">Belum ada evaluasi. Klik tombol di atas.</div>';
 const r=e.items.filter(i=>i.score!==null),good=r.filter(i=>i.score>=75),imp=r.filter(i=>i.score<60),pri=[...r].filter(i=>i.score<75).sort((a,b)=>a.score-b.score);
 const col=s=>s>=75?'ok':s>=55?'warn':'bad';
 return h+`<div class="card" style="margin-top:14px"><h3>Skor keseluruhan</h3>${e.overall!=null?`<div class="big">${e.overall}<span class="mut" style="font-size:1rem">/100</span></div>`:'<p class="warn">Belum dapat dihitung: minimal 3 indikator harus memiliki data.</p>'}<span class="mut">Dievaluasi ${esc(e.date)}</span></div>
 <div class="grid">${e.items.map(i=>`<div class="card"><h3>${i.label}</h3>${i.score!==null?`<div class="big ${col(i.score)}">${i.score}</div><div class="bar"><i style="width:${i.score}%"></i></div><p class="mut">${i.score<75?'Saran: '+i.tip:'Sudah baik.'}</p>`:`<p class="warn"><b>Belum dapat dinilai.</b></p><p class="mut">${i.why}</p>`}</div>`).join('')}</div>
 <div class="g2"><div class="card"><h3>Kelebihan yang sudah dimiliki</h3>${good.length?'<ul>'+good.map(i=>`<li>${i.label} (${i.score})</li>`).join('')+'</ul>':'<p class="mut">Belum ada indikator dengan skor ≥ 75.</p>'}</div>
 <div class="card"><h3>Aspek yang perlu ditingkatkan</h3>${imp.length?'<ul>'+imp.map(i=>`<li>${i.label} (${i.score})</li>`).join('')+'</ul>':'<p class="mut">Tidak ada indikator dengan skor &lt; 60.</p>'}</div></div>
 <div class="card"><h3>Prioritas perbaikan dan tindakan berikutnya</h3>${pri.length?'<ol>'+pri.map(i=>`<li><b>${i.label}</b>: ${i.tip}</li>`).join('')+'</ol>':'<p class="ok">Tidak ada prioritas mendesak. Pertahankan dan evaluasi ulang berkala.</p>'}${e.items.some(i=>i.score===null)?'<p class="warn">Lengkapi data untuk indikator yang belum dapat dinilai agar skor lebih akurat.</p>':''}</div>`}
function runEval(){S.evaluation=compute();if(save()){render();toast('Evaluasi selesai.')}}

/* ===== Pengaturan ===== */
function vSet(){const p=S.profile;return `<h1>Pengaturan</h1>
 <div class="card"><h3>Profil dan gaya komunikasi</h3><button class="btn alt" onclick="go('profil')">Edit profil</button>
 <label>Gaya komunikasi</label><select id="s_gaya" ${p?'':'disabled'}>${['Profesional','Ramah','Kreatif','Formal'].map(x=>`<option ${p&&p.gaya===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="setGaya()" ${p?'':'disabled'}>Simpan gaya</button>${p?'':'<p class="mut">Isi profil terlebih dahulu.</p>'}</div>
 <div class="card"><h3>Penyimpanan lokal</h3><p>Data tersimpan di <b>browser perangkat ini</b>, dapat hilang jika data browser dibersihkan, dan tidak ikut terbawa ke perangkat lain. Ekspor JSON secara berkala sebagai cadangan.</p>
 <p class="mut">Isi saat ini: profil ${p?'ada':'belum ada'}, ${S.drafts.length} draf, ${S.sessions.length} latihan, identitas ${S.identity?'ada':'belum ada'}.</p>
 <button class="btn" onclick="exportJ()">Ekspor ke JSON</button><button class="btn alt" onclick="$('imp').click()">Impor dari JSON</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJ(this)">
 <button class="btn danger" onclick="wipe()">Hapus Semua Data</button></div>`}
function setGaya(){S.profile.gaya=val('s_gaya');if(save()){toast('Gaya komunikasi diperbarui. Buat ulang identitas jika ingin menyesuaikan.');render()}}
function exportJ(){try{const b=new Blob([JSON.stringify(Object.assign({app:'brandup',v:1},S),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='brandup-data.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('File JSON diunduh.')}catch(e){toast('Ekspor gagal.',1)}}
function importJ(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onerror=()=>toast('File tidak dapat dibaca.',1);
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||d.app!=='brandup'||!Array.isArray(d.drafts||[])||!Array.isArray(d.sessions||[]))throw 0;
  if(d.profile&&typeof d.profile!=='object')throw 0;if(!confirm('Impor akan menimpa data saat ini. Lanjutkan?'))return;
  const prev=S;S=Object.assign(blank(),{profile:d.profile||null,identity:d.identity||null,drafts:d.drafts||[],sessions:d.sessions||[],evaluation:d.evaluation||null,seed:+d.seed||0});
  if(!save()){S=prev;return}tmpId=null;work=null;ideas=[];render();toast('Data berhasil diimpor.')}catch(e){toast('File JSON tidak valid untuk aplikasi ini.',1)}inp.value=''};r.readAsText(f)}
function wipe(){if(!confirm('Hapus SEMUA data lokal (profil, identitas, draf, latihan, evaluasi)? Tindakan tidak dapat dibatalkan.'))return;
 try{localStorage.removeItem(KEY)}catch(e){return toast('Gagal menghapus data.',1)}S=blank();tmpId=null;work=null;ideas=[];IV={phase:'setup',cfg:{},qs:[],i:0,ans:[]};render();toast('Semua data lokal dihapus.')}

/* ===== Mulai ===== */
const _render=render;render=function(){_render();if(cur==='profil')afterProfil()};
cur=(location.hash||'').slice(1);if(!PAGES.some(p=>p[0]===cur))cur='dashboard';render();
</script>
</body>
